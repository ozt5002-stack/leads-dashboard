    --status-prospect-bg: #241b33; --status-prospect-fg: #d8b4fe; --status-prospect-ring: rgba(216,180,254,0.18);
    --status-negotiation-bg: #2a2210; --status-negotiation-fg: #fbbf24; --status-negotiation-ring: rgba(251,191,36,0.18);
    --status-won-bg: #102015; --status-won-fg: #4ade80; --status-won-ring: rgba(74,222,128,0.18);

  body { background: var(--bg-page); margin: 0; }
  .surface { background: var(--bg-card); border-color: var(--border); }

  .badge-Negotiation { background: var(--status-negotiation-bg); color: var(--status-negotiation-fg); border-color: var(--status-negotiation-ring); }
  .badge-Won { background: var(--status-won-bg); color: var(--status-won-fg); border-color: var(--status-won-ring); }
  .badge-Lost { background: var(--status-lost-bg); color: var(--status-lost-fg); border-color: var(--status-lost-ring); }
  .search-input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .filter-pill { border-width: 1px; border-style: solid; }
  .filter-inactive { background: var(--bg-card); color: var(--text-muted); border-color: var(--border); }
  .filter-active-Lead { background: #2563eb; color: #fff; border-color: #2563eb; }
  .filter-active-Prospect { background: #9333ea; color: #fff; border-color: #9333ea; }
  .filter-active-Negotiation { background: #d97706; color: #fff; border-color: #d97706; }

  .filter-active-Lost { background: #dc2626; color: #fff; border-color: #dc2626; }
  .modal-backdrop { background: rgba(2, 6, 23, 0.5); }
  .modal-card { background: var(--bg-card); }
  .field-label { color: var(--text-secondary); }
  .field-input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); }
  .field-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .btn-ghost { color: var(--text-secondary); }
  .btn-ghost:hover { background: var(--row-hover); }
  .edit-row { background: color-mix(in srgb, var(--accent) 8%, var(--bg-card)); }
  .cell-input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); }
  .cell-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .btn-save { background: var(--accent); color: var(--accent-fg); }
  .btn-save:hover { background: var(--accent-hover); }
  .tab-bar { border-color: var(--border); }
  .tab { color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text-primary); }
  .tab-active { color: var(--accent); border-bottom-color: var(--accent); }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useMemo, useRef, useState } = React;
const { Bar, BarChart, Cell, Legend, Pie, PieChart, ResponsiveContainer, Tooltip, XAxis, YAxis } = Recharts;

const STATUSES = ["Lead", "Prospect", "Negotiation", "Won", "Lost"];
const STORAGE_KEY = "leads";

const AIRTABLE_BASE_ID = "app1J5xG4dxtt52N9";
const AIRTABLE_TABLE_ID = "tblskKJU5N03BDSjh";
const AIRTABLE_TOKEN_KEY = "airtable_pat";

function mapAirtableRecords(records) {
  return records.map((record, index) => ({
    id: index + 1,
    name: record.fields["שם"] || "",
    company: record.fields["חברה"] || "",
    status: record.fields["סטטוס"] || "Lead",
    value: Number(record.fields["ערך"]) || 0,
    source: record.fields["מקור"] || "",
    notes: record.fields["הערות"] || "",
  }));
}

const STATUS_CHART_COLORS = {
  Lead: "#2563eb",
  Prospect: "#9333ea",
  Negotiation: "#d97706",
  Won: "#16a34a",
  Lost: "#dc2626",
};

const INITIAL_LEADS = [
  { id: 1, name: "דנה כהן", company: "Nexora Ltd", status: "Won", value: 24000, source: "Referral", notes: "חתמו חוזה שנתי" },
  { id: 2, name: "יוסי לוי", company: "BluePeak Tech", status: "Negotiation", value: 15500, source: "Website", notes: "מחכים לאישור תקציב" },
  { id: 3, name: "מאיה שגיא", company: "Greenfield Foods", status: "Prospect", value: 8200, source: "LinkedIn", notes: "פגישה נקבעה לשבוע הבא" },
  { id: 4, name: "אורי בן דוד", company: "Skyline Media", status: "Lead", value: 5000, source: "Cold Call", notes: "עדיין לא נוצר קשר ראשוני" },
  { id: 5, name: "נועה פרץ", company: "Orbit Systems", status: "Won", value: 32000, source: "Referral", notes: "לקוח מרוצה, אפשרות להרחבה" },
  { id: 6, name: "עידן שמעוני", company: "Fusion Labs", status: "Lost", value: 12000, source: "Website", notes: "בחרו במתחרה" },
  { id: 7, name: "טל אברהם", company: "Cedar & Co", status: "Prospect", value: 9800, source: "Trade Show", notes: "מעוניינים בהדגמה" },
  { id: 8, name: "ליאור גל", company: "Northgate Retail", status: "Negotiation", value: 21000, source: "LinkedIn", notes: "מו״מ על מחיר" },
  { id: 9, name: "שירה מזרחי", company: "Vantage Group", status: "Lead", value: 3000, source: "Email Campaign", notes: "הורידו חוברת מוצר" },
  { id: 10, name: "רועי אלון", company: "Harbor Solutions", status: "Won", value: 18500, source: "Referral", notes: "חתימה חודשית" },
];

function formatCurrency(value) {
  return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(value);
}

const EMPTY_LEAD = { name: "", company: "", status: "Lead", value: "", source: "", notes: "" };

function AddLeadModal({ onSave, onClose }) {
  const [form, setForm] = useState(EMPTY_LEAD);

  function handleChange(field, value) {
    setForm((prev) => ({ ...prev, [field]: value }));
  }

  function handleSubmit(e) {
    e.preventDefault();
    onSave({ ...form, value: Number(form.value) || 0 });
  }

  return (
    <div className="modal-backdrop fixed inset-0 z-10 flex items-center justify-center p-4" onClick={onClose}>
      <form onClick={(e) => e.stopPropagation()} onSubmit={handleSubmit} className="modal-card w-full max-w-md rounded-xl p-6 shadow-xl">
        <h2 className="mb-4 text-lg font-bold text-p">הוספת ליד חדש</h2>
        <div className="space-y-3">
          <div>
            <label className="field-label mb-1 block text-xs font-medium">שם</label>
            <input required type="text" value={form.name} onChange={(e) => handleChange("name", e.target.value)} className="field-input w-full rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="field-label mb-1 block text-xs font-medium">חברה</label>
            <input required type="text" value={form.company} onChange={(e) => handleChange("company", e.target.value)} className="field-input w-full rounded-lg px-3 py-2 text-sm" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label mb-1 block text-xs font-medium">סטטוס</label>
              <select value={form.status} onChange={(e) => handleChange("status", e.target.value)} className="field-input w-full rounded-lg px-3 py-2 text-sm">
                {STATUSES.map((status) => (
                  <option key={status} value={status}>{status}</option>
                ))}
              </select>
            </div>
            <div>
              <label className="field-label mb-1 block text-xs font-medium">ערך ($)</label>
              <input required type="number" min="0" value={form.value} onChange={(e) => handleChange("value", e.target.value)} className="field-input w-full rounded-lg px-3 py-2 text-sm" />
            </div>
          </div>
          <div>
            <label className="field-label mb-1 block text-xs font-medium">מקור</label>
            <input type="text" value={form.source} onChange={(e) => handleChange("source", e.target.value)} className="field-input w-full rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="field-label mb-1 block text-xs font-medium">הערות</label>
            <textarea rows={2} value={form.notes} onChange={(e) => handleChange("notes", e.target.value)} className="field-input w-full rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>
        <div className="mt-5 flex justify-end gap-2">
          <button type="button" onClick={onClose} className="btn-ghost rounded-lg px-4 py-2.5 text-sm font-medium" style={{minHeight: 44}}>ביטול</button>
          <button type="submit" className="btn-primary rounded-lg px-4 py-2.5 text-sm font-medium" style={{minHeight: 44}}>שמירה</button>
        </div>
      </form>
    </div>
  );
}

function LeadsDashboard() {
  const [leads, setLeads] = useState(INITIAL_LEADS);
  const [searchQuery, setSearchQuery] = useState("");
  const [activeStatuses, setActiveStatuses] = useState(new Set(STATUSES));
  const [isAdding, setIsAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [syncStatus, setSyncStatus] = useState("loading");
  const hasLoadedRef = useRef(false);

  async function loadFromAirtable(token) {
    try {
      const res = await fetch(
        `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_ID}`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      if (!res.ok) throw new Error(`Airtable request failed: ${res.status}`);
      const data = await res.json();
      setLeads(mapAirtableRecords(data.records));
      setSyncStatus("airtable");
      return true;
    } catch (err) {
      console.error("Airtable fetch failed, falling back to local data:", err);
      return false;
    }
  }

  function loadFromLocalOrDefault() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        setLeads(JSON.parse(stored));
      } catch {}
    }
  }

  function handleConnectAirtable() {
    const token = window.prompt("הדבק כאן את ה-Airtable Personal Access Token (עם הרשאות read + write):");
    if (!token) return;
    localStorage.setItem(AIRTABLE_TOKEN_KEY, token);
    setSyncStatus("loading");
    loadFromAirtable(token).then((ok) => {
      if (!ok) {
        localStorage.removeItem(AIRTABLE_TOKEN_KEY);
        loadFromLocalOrDefault();
        setSyncStatus("local");
      }
    });
  }

  useEffect(() => {
    async function init() {
      const savedToken = localStorage.getItem(AIRTABLE_TOKEN_KEY);
      if (savedToken) {
        const ok = await loadFromAirtable(savedToken);
        if (ok) return;
      }
      loadFromLocalOrDefault();
      setSyncStatus(savedToken ? "local" : "no-token");
    }
    init();
  }, []);

  useEffect(() => {
    if (!hasLoadedRef.current) {
      hasLoadedRef.current = true;
      return;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
  }, [leads]);

  function handleExport() {
    const blob = new Blob([JSON.stringify(leads, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "leads.json";
    link.click();
    URL.revokeObjectURL(url);
  }

  function handleDelete(id) {
    setLeads((prev) => prev.filter((lead) => lead.id !== id));
  }

  function handleAddLead(leadData) {
    const nextId = leads.length > 0 ? Math.max(...leads.map((l) => l.id)) + 1 : 1;
    setLeads((prev) => [...prev, { ...leadData, id: nextId }]);
    setIsAdding(false);
  }

  function startEdit(lead) {
    setEditingId(lead.id);
    setEditDraft({ ...lead });
  }

  function updateEditDraft(field, value) {
    setEditDraft((prev) => ({ ...prev, [field]: value }));
  }

  function saveEdit() {
    setLeads((prev) =>
      prev.map((lead) => (lead.id === editingId ? { ...editDraft, id: editingId, value: Number(editDraft.value) || 0 } : lead))
    );
    setEditingId(null);
    setEditDraft(null);
  }

  function cancelEdit() {
    setEditingId(null);
    setEditDraft(null);
  }

  function toggleStatus(status) {
    setActiveStatuses((prev) => {
      const next = new Set(prev);
      if (next.has(status)) {
        next.delete(status);
      } else {
        next.add(status);
      }
      return next;
    });
  }

  const filteredLeads = useMemo(() => {
    const query = searchQuery.trim().toLowerCase();
    return leads.filter((lead) => {
      const matchesStatus = activeStatuses.has(lead.status);
      const matchesQuery =
        query === "" ||
        lead.name.toLowerCase().includes(query) ||
        lead.company.toLowerCase().includes(query);
      return matchesStatus && matchesQuery;
    });
  }, [leads, searchQuery, activeStatuses]);

  const statusBreakdown = useMemo(() => {
    return STATUSES.map((status) => {
      const matching = filteredLeads.filter((lead) => lead.status === status);
      return {
        status,
        count: matching.length,
        totalValue: matching.reduce((sum, lead) => sum + lead.value, 0),
      };
    });
  }, [filteredLeads]);

  const pieData = statusBreakdown.filter((entry) => entry.count > 0);

  const metrics = useMemo(() => {
    const total = filteredLeads.length;
    const totalValue = filteredLeads.reduce((sum, lead) => sum + lead.value, 0);
    const averageValue = total > 0 ? totalValue / total : 0;
    const wonCount = filteredLeads.filter((lead) => lead.status === "Won").length;
    const wonRate = total > 0 ? (wonCount / total) * 100 : 0;
    return { total, averageValue, wonRate };
  }, [filteredLeads]);

  return (
    <div className="min-h-screen p-4 sm:p-6" dir="rtl">
      <div className="mx-auto max-w-6xl">
        <div className="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 className="text-2xl font-bold text-p">ניהול לידים</h1>
            <p className="text-m mt-1 text-xs">
              {syncStatus === "loading" && "טוען..."}
              {syncStatus === "airtable" && "✓ מסונכרן עם Airtable"}
              {syncStatus === "local" && "⚠ לא הצלחתי להתחבר ל-Airtable, מציג נתונים מקומיים"}
              {syncStatus === "no-token" && "לא מחובר ל-Airtable — מציג נתוני דוגמה"}
            </p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={handleConnectAirtable} className="btn-ghost rounded-lg border px-4 py-2.5 text-sm font-medium" style={{borderColor:"var(--border)", minHeight: 44}}>
              חבר Airtable
            </button>
            <button type="button" onClick={handleExport} className="btn-ghost rounded-lg border px-4 py-2.5 text-sm font-medium" style={{borderColor:"var(--border)", minHeight: 44}}>
              Export JSON
            </button>
            <button type="button" onClick={() => setIsAdding(true)} className="btn-primary rounded-lg px-4 py-2.5 text-sm font-medium shadow-sm" style={{minHeight: 44}}>
              + הוסף ליד חדש
            </button>
          </div>
        </div>

        <div className="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div className="surface rounded-xl border p-4 shadow-sm">
            <p className="text-s text-sm">סה״כ לידים</p>
            <p className="text-p mt-1 text-3xl font-bold">{metrics.total}</p>
          </div>
          <div className="surface rounded-xl border p-4 shadow-sm">
            <p className="text-s text-sm">ממוצע ערך</p>
            <p className="text-p mt-1 text-3xl font-bold">{formatCurrency(metrics.averageValue)}</p>
          </div>
          <div className="surface rounded-xl border p-4 shadow-sm">
            <p className="text-s text-sm">שיעור Won</p>
            <p className="text-p mt-1 text-3xl font-bold">{metrics.wonRate.toFixed(0)}%</p>
          </div>
        </div>

        <div className="mb-6 flex flex-col gap-4 md:flex-row">
          <div className="surface flex-1 rounded-xl border p-4 shadow-sm">
            <h2 className="text-p mb-2 text-sm font-semibold">התפלגות לידים לפי סטטוס</h2>
            {pieData.length > 0 ? (
              <div style={{ height: 256 }}>
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart>
                    <Pie data={pieData} dataKey="count" nameKey="status" cx="50%" cy="50%" outerRadius={80} paddingAngle={2}>
                      {pieData.map((entry) => (
                        <Cell key={entry.status} fill={STATUS_CHART_COLORS[entry.status]} stroke="var(--bg-card)" strokeWidth={2} />
                      ))}
                    </Pie>
                    <Tooltip formatter={(value, name) => [`${value} לידים`, name]} />
                    <Legend />
                  </PieChart>
                </ResponsiveContainer>
              </div>
            ) : (
              <div className="text-m flex items-center justify-center text-sm" style={{ height: 256 }}>אין נתונים להצגה</div>
            )}
          </div>

          <div className="surface flex-1 rounded-xl border p-4 shadow-sm">
            <h2 className="text-p mb-2 text-sm font-semibold">סכום ערך לפי סטטוס</h2>
            <div style={{ height: 256 }}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={statusBreakdown} margin={{ top: 8, right: 8, left: 8, bottom: 8 }}>
                  <XAxis dataKey="status" tick={{ fontSize: 12, fill: "#64748b" }} />

const TYPE_COMPETITOR = "חשמלאי מתחרה";

// Keyword buckets used to tag every scraped title with a topic.
const TOPIC_KEYWORDS = [
  ["סולארי", ["סולאר", "ממיר", "פאנל", "אינוורטר", "pv", "פוטו"]],
  ["רכב חשמלי", ["רכב חשמלי", "עמדת טעינה", "טעינה"]],
  ["הארקה ואיפוס", ["הארק", "איפוס", "אפס", "tn-c", "אלקטרודה"]],
  ["ממסר פחת", ["פחת", "rcd", "ממסר"]],
  ["לוח ומפסקים", ["לוח", "מפסק", "מאמ\"ת", "מאמת", "נתיך", "פאזה"]],
  ["כבלים וחתכים", ["כבל", "חתך", "מוליך", "ממ\"ר", "ממר", "מפל מתח"]],
  ["מנועים והנעה", ["מנוע", "משנה תדר", "vfd", "מדחס"]],
  ["תאורה", ["תאורה", "נורה", "led", "גוף תאורה"]],
  ["בדיקה ורישוי", ["בודק", "בדיקה", "רישיון", "רישוי", "מבחן", "הסמכה"]],
  ["תקנות", ["תקנה", "תקנות", "חוק"]],
];

// A question with no replies only counts as "stuck" after this many days;
// newer ones may simply not have been answered yet.
const STUCK_AFTER_DAYS = 7;

const AGE_UNITS = [
  ["שעתיים", 2 / 24], ["יומיים", 2], ["שבועיים", 14], ["חודשיים", 60], ["שנתיים", 730],
  ["דק", 1 / 1440], ["שעה", 1 / 24], ["שעות", 1 / 24], ["יום", 1], ["ימים", 1],
  ["שבוע", 7], ["חודש", 30], ["שנה", 365], ["שנים", 365],
];

// bbPress shows relative times like "לפני 3 ימים, 4 שעות" or "לפני שבועיים";
// the first (largest) unit is enough. Returns null when the text can't be read.
function parseAgeDays(text) {
  const match = (text || "").match(/(\d+)?\s*(שעתיים|יומיים|שבועיים|חודשיים|שנתיים|דק|שעה|שעות|יום|ימים|שבוע|חודש|שנה|שנים)/);
  if (!match) return null;
  const perUnit = AGE_UNITS.find(([word]) => word === match[2])[1];
  return (match[1] ? parseInt(match[1], 10) : 1) * perUnit;
}

// Age measured from now: the age shown at scrape time plus the time since that scrape.
function questionAgeDays(item) {
  const ageAtScrape = parseAgeDays(item.date);
  if (ageAtScrape == null || !item.scrapedAt) return null;
  return ageAtScrape + (Date.now() - new Date(item.scrapedAt).getTime()) / 86400000;
}

// Unknown age counts as stuck, so an unreadable date never hides a question.
function isStuck(item) {
  if (item.type !== TYPE_QUESTION || item.replies !== 0) return false;
  const age = questionAgeDays(item);
  return age == null || age >= STUCK_AFTER_DAYS;
}

function classifyTopic(text) {
  const lower = (text || "").toLowerCase();
  for (const [topic, words] of TOPIC_KEYWORDS) {
    if (words.some((w) => lower.includes(w))) return topic;
  }
  return "אחר";
}

// Runs inside Apify's cheerio-scraper (not in the browser), so it must be self-contained.
const APIFY_PAGE_FUNCTION = `async function pageFunction(context) {
  const { $, request, log } = context;
  const url = request.url;
  const clean = (s) => (s || "").replace(/\\s+/g, " ").trim();
  const results = [];

  if (url.includes("arielsegal.co.il")) {
    $("ul.topic, li.bbp-body > ul").each((i, el) => {
      const link = $(el).find("a.bbp-topic-permalink").first();
      if (!link.length) return;
      results.push({
        source: "arielsegal.co.il",
        type: "question",
        title: clean(link.text()),
        url: link.attr("href"),
        author: clean($(el).find(".bbp-topic-started-by .bbp-author-name").first().text()),
        forum: clean($(el).find(".bbp-topic-started-in a").first().text()),
        replies: parseInt(clean($(el).find(".bbp-topic-reply-count").first().text()), 10) || 0,
        date: clean($(el).find(".bbp-topic-freshness a").first().text()),
      });
    });
  } else {
    // pro.co.il: read structured data (JSON-LD / Next.js payload) and pick objects that look like businesses.
    const blobs = [];
    $('script[type="application/ld+json"], script#__NEXT_DATA__').each((i, el) => {
      try { blobs.push(JSON.parse($(el).contents().text())); } catch (e) {}
    });
    const seen = new Set();
    const walk = (node) => {
      if (!node || typeof node !== "object") return;
      if (Array.isArray(node)) return node.forEach(walk);
      const rating = node.aggregateRating || node.rating || node.ratingValue || node.reviewsCount || node.reviewCount;
      if (typeof node.name === "string" && rating !== undefined) {
        const r = node.aggregateRating || {};
        const link = node.url || node.link || node.slug || "";
        const key = node.name + "|" + link;
        if (!seen.has(key)) {
          seen.add(key);
          results.push({
            source: "pro.co.il",
            type: "competitor",
            title: clean(node.name),
            url: link ? new URL(String(link), "https://www.pro.co.il/").href : url + "#" + encodeURIComponent(node.name),
            rating: parseFloat(r.ratingValue || node.ratingValue || node.rating) || null,
            replies: parseInt(r.reviewCount || r.ratingCount || node.reviewsCount || node.reviewCount, 10) || 0,
            details: clean([node.description, node.address && (node.address.addressLocality || node.address), node.areaServed].filter((x) => typeof x === "string").join(" | ")),
          });
        }
      }
      Object.values(node).forEach(walk);
    };
    blobs.forEach(walk);
  }

  log.info(url + " -> " + results.length + " items");
  return results;
}`;

function apifyStartUrls(sources, arielPages) {
  const urls = [];
  if (sources.includes(SOURCE_ARIEL)) {
    for (let page = 1; page <= arielPages; page++) {
      urls.push({ url: page === 1 ? "https://arielsegal.co.il/topics/" : `https://arielsegal.co.il/topics/page/${page}/` });
    }
  }
  if (sources.includes(SOURCE_PRO)) {
    urls.push({ url: "https://www.pro.co.il/electricians" });
  }
  return urls;
}

const APIFY_FINAL_STATUSES = ["SUCCEEDED", "FAILED", "TIMED-OUT", "ABORTED"];

// Every API call goes through here so an error always names the service and shows
// what came back, even when the body isn't JSON (e.g. an HTML error page).
async function fetchJson(label, url, options) {
  const res = await fetch(url, options);
  const text = await res.text();
  if (!res.ok) throw new Error(`${label} ${res.status}: ${text.slice(0, 200)}`);
  try {
    return JSON.parse(text);
  } catch {
    throw new Error(`${label} ${res.status} החזיר תשובה שאינה JSON: ${text.slice(0, 120)}`);
  }
}

async function runApifyScraper(token, sources, arielPages, onProgress = () => {}) {
  const input = {
    startUrls: apifyStartUrls(sources, arielPages),
    pageFunction: APIFY_PAGE_FUNCTION,
    maxCrawlingDepth: 0,
    maxConcurrency: 3,
    proxyConfiguration: { useApifyProxy: true },
  };
  const auth = { Authorization: `Bearer ${token}` };

  // Start the run and poll it, instead of holding one HTTP request open for minutes
  // (fragile on mobile networks).
  const started = await fetchJson("Apify (הפעלת ריצה)", `https://api.apify.com/v2/acts/${APIFY_ACTOR}/runs`, {
    method: "POST",
    headers: { ...auth, "Content-Type": "application/json" },
    body: JSON.stringify(input),
  });
  let run = started.data;
  const consoleUrl = `https://console.apify.com/view/runs/${run.id}`;
  const deadline = Date.now() + 10 * 60 * 1000;
  while (!APIFY_FINAL_STATUSES.includes(run.status)) {
    if (Date.now() > deadline) throw new Error(`הריצה ב-Apify לא הסתיימה תוך 10 דקות: ${consoleUrl}`);
    onProgress(`סורק דרך Apify... סטטוס: ${run.status}`);
    const polled = await fetchJson("Apify (סטטוס ריצה)", `https://api.apify.com/v2/actor-runs/${run.id}?waitForFinish=30`, { headers: auth });
    run = polled.data;
  }
  if (run.status !== "SUCCEEDED") throw new Error(`הריצה ב-Apify הסתיימה בסטטוס ${run.status}: ${consoleUrl}`);

  const items = await fetchJson(
    "Apify (תוצאות)",
    `https://api.apify.com/v2/datasets/${run.defaultDatasetId}/items?clean=true&format=json`,
    { headers: auth }
  );
  return items.filter((item) => item && item.url && item.title);
}

function toAirtableFields(item, scrapedAt) {
  const isQuestion = item.type === "question";
  const fields = {
    "כותרת": item.title,
    "מקור": item.source,
    "סוג": isQuestion ? TYPE_QUESTION : TYPE_COMPETITOR,
    "קישור": item.url,
    "נושא": isQuestion ? classifyTopic(item.title) : "",
    "מחבר": item.author || "",
    "תגובות": item.replies || 0,
    "תאריך": item.date || "",
    "פרטים": item.details || item.forum || "",
    "נסרק ב": scrapedAt,
  };
  if (item.rating != null) fields["דירוג"] = item.rating;
  return fields;
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// Upsert on "קישור" so re-running the scraper updates rows instead of duplicating them,
// and never touches "סטטוס" so manual review decisions survive a re-scrape.
async function upsertToAirtable(token, items) {
  const scrapedAt = new Date().toISOString();
  for (let i = 0; i < items.length; i += 10) {
    const batch = items.slice(i, i + 10).map((item) => ({ fields: toAirtableFields(item, scrapedAt) }));
    await fetchJson("Airtable (שמירה)", `https://api.airtable.com/v0/${MR_AIRTABLE_BASE_ID}/${MR_FORUM_TABLE_ID}`, {
      method: "PATCH",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ performUpsert: { fieldsToMergeOn: ["קישור"] }, records: batch, typecast: true }),
    });
    await sleep(250); // Airtable allows 5 requests/sec per base
  }
}

async function fetchForumLeads(token) {
  const records = [];
  let offset;
  do {
    const params = new URLSearchParams({ pageSize: "100" });
    if (offset) params.set("offset", offset);
    const data = await fetchJson("Airtable (קריאה)", `https://api.airtable.com/v0/${MR_AIRTABLE_BASE_ID}/${MR_FORUM_TABLE_ID}?${params}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    records.push(...data.records);
    offset = data.offset;
  } while (offset);
  return records.map((record) => ({
    id: record.id,
    title: record.fields["כותרת"] || "",
    source: record.fields["מקור"] || "",
    type: record.fields["סוג"] || "",
    url: record.fields["קישור"] || "",
    topic: record.fields["נושא"] || "",
    author: record.fields["מחבר"] || "",
    replies: Number(record.fields["תגובות"]) || 0,
    rating: record.fields["דירוג"],
    date: record.fields["תאריך"] || "",
    scrapedAt: record.fields["נסרק ב"] || "",
    status: record.fields["סטטוס"] || "חדש",
  }));
}

async function updateForumLeadStatus(token, recordId, status) {
  await fetchJson("Airtable (עדכון סטטוס)", `https://api.airtable.com/v0/${MR_AIRTABLE_BASE_ID}/${MR_FORUM_TABLE_ID}/${recordId}`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ fields: { "סטטוס": status } }),
  });
}

function readStoredToken(key) {
  try {
    return localStorage.getItem(key) || "";
  } catch {
    return "";
  }
}

function MarketResearch() {
  const [apifyToken, setApifyToken] = useState(() => readStoredToken(MR_APIFY_TOKEN_KEY));
  const [airtableToken, setAirtableToken] = useState(() => readStoredToken(MR_AIRTABLE_TOKEN_KEY));
  const [items, setItems] = useState([]);
  const [sources, setSources] = useState([SOURCE_ARIEL, SOURCE_PRO]);
  const [arielPages, setArielPages] = useState(3);
  const [typeFilter, setTypeFilter] = useState("all");
  const [onlyUnanswered, setOnlyUnanswered] = useState(false);
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState("");

  async function reload(token = airtableToken) {
    if (!token) return;
    try {
      setItems(await fetchForumLeads(token));
    } catch (err) {
      setMessage(`⚠ לא הצלחתי לקרוא את "Forum Leads" (${err.message}). ודא שלטוקן יש גישה לטבלה.`);
    }
  }

  useEffect(() => {
    reload();
  }, []);

  function promptToken(key, label, setter) {
    const token = window.prompt(label);
    if (!token) return null;
    try {
      localStorage.setItem(key, token.trim());
    } catch {}
    setter(token.trim());
    return token.trim();
  }

  function handleConnectApify() {
    promptToken(MR_APIFY_TOKEN_KEY, "הדבק כאן את ה-Apify API Token (Settings → API & Integrations):", setApifyToken);
  }

  function handleConnectAirtable() {
    const token = promptToken(
      MR_AIRTABLE_TOKEN_KEY,
      "הדבק Airtable Personal Access Token עם הרשאות data.records:read + data.records:write:",
      setAirtableToken
    );
    if (token) reload(token);
  }

  function toggleSource(source) {
    setSources((prev) => (prev.includes(source) ? prev.filter((s) => s !== source) : [...prev, source]));
  }

  async function handleRun() {
    if (!apifyToken || !airtableToken || sources.length === 0) return;
    setBusy(true);
    try {
      setMessage("מפעיל ריצה ב-Apify... (יכול לקחת 1–4 דקות, השאר את הדף פתוח)");
      const scraped = await runApifyScraper(apifyToken, sources, arielPages, setMessage);
      const counts = sources.map((s) => `${s}: ${scraped.filter((i) => i.source === s).length}`).join(" · ");
      if (scraped.length === 0) {
        setMessage(`Apify החזיר 0 פריטים (${counts}). כנראה מבנה האתר השתנה — בדוק את הלוג של הריצה ב-Apify Console.`);
        return;
      }
      setMessage(`נמצאו ${scraped.length} פריטים (${counts}). שולח ל-Airtable...`);
      await upsertToAirtable(airtableToken, scraped);
      await reload();
      setMessage(`✓ ${scraped.length} פריטים נשמרו ב-Forum Leads (${counts})`);
    } catch (err) {
      console.error(err);
      setMessage(`⚠ ${err.message}`);
    } finally {
      setBusy(false);
    }
  }

  async function handleStatusChange(item, status) {
    setItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, status } : i)));
    try {
      await updateForumLeadStatus(airtableToken, item.id, status);
    } catch (err) {
      setMessage(`⚠ עדכון סטטוס נכשל: ${err.message}`);
      setItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, status: item.status } : i)));
    }
  }

  const questions = useMemo(() => items.filter((i) => i.type === TYPE_QUESTION), [items]);
  const competitors = useMemo(() => items.filter((i) => i.type === TYPE_COMPETITOR), [items]);

  const topicData = useMemo(() => {
    const counts = {};
    questions.forEach((q) => {
      const topic = q.topic || "אחר";
      counts[topic] = counts[topic] || { topic, answered: 0, waiting: 0, unanswered: 0 };
      const bucket = q.replies > 0 ? "answered" : isStuck(q) ? "unanswered" : "waiting";
      counts[topic][bucket] += 1;
    });
    // Topics where electricians get stuck without an answer come first.
    return Object.values(counts).sort(
      (a, b) => b.unanswered - a.unanswered || b.answered + b.waiting + b.unanswered - (a.answered + a.waiting + a.unanswered)
    );
  }, [questions]);

  const unansweredCount = questions.filter(isStuck).length;
  const ratedCompetitors = competitors.filter((c) => typeof c.rating === "number");
  const avgRating = ratedCompetitors.length
    ? ratedCompetitors.reduce((sum, c) => sum + c.rating, 0) / ratedCompetitors.length
    : null;

  const visibleItems = useMemo(() => {
    return items.filter((i) => {
      if (typeFilter !== "all" && i.type !== typeFilter) return false;
      if (onlyUnanswered && !isStuck(i)) return false;
      return true;
    });
  }, [items, typeFilter, onlyUnanswered]);

  const canRun = apifyToken && airtableToken && sources.length > 0 && !busy;

  return (
    <div>
      <div className="surface mb-6 rounded-xl border p-4 shadow-sm">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div className="text-s text-xs">
            <p>Apify: {apifyToken ? "✓ מחובר" : "לא מחובר"} · Airtable: {airtableToken ? "✓ מחובר" : "לא מחובר"}</p>
            <p className="mt-1">
              סריקה אוטומטית רצה כל בוקר ב-GitHub Actions ·{" "}
              <a href={SCRAPE_WORKFLOW_URL} target="_blank" rel="noopener noreferrer" className="btn-edit underline">הפעל עכשיו</a>
            </p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button type="button" disabled={!airtableToken || busy} onClick={() => reload()} className="btn-ghost rounded-lg border px-4 py-2.5 text-sm font-medium disabled:opacity-50" style={{ borderColor: "var(--border)", minHeight: 44 }}>
              רענן נתונים
            </button>
            <button type="button" onClick={handleConnectApify} className="btn-ghost rounded-lg border px-4 py-2.5 text-sm font-medium" style={{ borderColor: "var(--border)", minHeight: 44 }}>
              חבר Apify
            </button>
            <button type="button" onClick={handleConnectAirtable} className="btn-ghost rounded-lg border px-4 py-2.5 text-sm font-medium" style={{ borderColor: "var(--border)", minHeight: 44 }}>
              חבר Airtable
            </button>
          </div>
        </div>

        <div className="mt-4 flex flex-wrap items-center gap-3">
          {[SOURCE_ARIEL, SOURCE_PRO].map((source) => (
            <label key={source} className="text-s flex items-center gap-2 text-sm">
              <input type="checkbox" checked={sources.includes(source)} onChange={() => toggleSource(source)} />
              {source}
            </label>
          ))}
          <label className="text-s flex items-center gap-2 text-sm">
            עמודי פורום:
            <input type="number" min="1" max="20" value={arielPages} onChange={(e) => setArielPages(Math.min(20, Math.max(1, Number(e.target.value) || 1)))} className="field-input w-16 rounded-md px-2 py-1 text-sm" />
          </label>
          <button type="button" disabled={!canRun} onClick={handleRun} className="btn-primary rounded-lg px-4 py-2.5 text-sm font-medium shadow-sm disabled:opacity-50" style={{ minHeight: 44 }}>
            {busy ? "סורק..." : "הרץ סריקה"}
          </button>
        </div>
        {message && <p className="text-s mt-3 text-sm">{message}</p>}
      </div>

      <div className="mb-6 grid grid-cols-2 gap-4 sm:grid-cols-4">
        <div className="surface rounded-xl border p-4 shadow-sm">
          <p className="text-s text-sm">שאלות בפורום</p>
          <p className="text-p mt-1 text-3xl font-bold">{questions.length}</p>
        </div>
        <div className="surface rounded-xl border p-4 shadow-sm">
          <p className="text-s text-sm">בלי תשובה מעל שבוע</p>
          <p className="text-p mt-1 text-3xl font-bold">{unansweredCount}</p>
        </div>
        <div className="surface rounded-xl border p-4 shadow-sm">
          <p className="text-s text-sm">מתחרים (pro.co.il)</p>
          <p className="text-p mt-1 text-3xl font-bold">{competitors.length}</p>
        </div>
        <div className="surface rounded-xl border p-4 shadow-sm">
          <p className="text-s text-sm">דירוג ממוצע למתחרים</p>
          <p className="text-p mt-1 text-3xl font-bold">{avgRating ? avgRating.toFixed(1) : "—"}</p>
        </div>
      </div>

      <div className="surface mb-6 rounded-xl border p-4 shadow-sm">
        <h2 className="text-p mb-2 text-sm font-semibold">איפה חשמלאים נתקעים (שאלות לפי נושא)</h2>
        {topicData.length > 0 ? (
          <div style={{ height: Math.max(200, topicData.length * 32) }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={topicData} layout="vertical" margin={{ top: 4, right: 8, left: 8, bottom: 4 }}>
                <XAxis type="number" reversed allowDecimals={false} tick={{ fontSize: 12, fill: "#64748b" }} />
                <YAxis type="category" dataKey="topic" width={110} orientation="right" tick={{ fontSize: 12, fill: "#64748b", textAnchor: "end" }} />
                <Tooltip formatter={(value, name) => [`${value} שאלות`, name]} />
                <Legend />
                <Bar dataKey="unanswered" name="בלי תשובה מעל שבוע" stackId="q" fill="var(--accent)" />
                <Bar dataKey="waiting" name="חדשה, עוד מחכה" stackId="q" fill="var(--status-negotiation-fg)" />
                <Bar dataKey="answered" name="נענו" stackId="q" fill="var(--text-muted)" />
              </BarChart>
            </ResponsiveContainer>
          </div>
        ) : (
          <div className="text-m flex items-center justify-center text-sm" style={{ height: 200 }}>
            אין עדיין נתונים — חבר Apify ו-Airtable והרץ סריקה
          </div>
        )}
      </div>

      <div className="mb-4 flex flex-wrap items-center gap-2">
        {[["all", "הכל"], [TYPE_QUESTION, "שאלות"], [TYPE_COMPETITOR, "מתחרים"]].map(([value, label]) => (
          <button key={value} type="button" onClick={() => setTypeFilter(value)} className={`filter-pill rounded-full px-3.5 py-1.5 text-sm font-medium ${typeFilter === value ? "btn-primary" : "filter-inactive"}`} style={{ minHeight: 36 }}>
            {label}
          </button>
        ))}
        <label className="text-s flex items-center gap-2 text-sm">
          <input type="checkbox" checked={onlyUnanswered} onChange={(e) => setOnlyUnanswered(e.target.checked)} />
          רק שאלות בלי תשובה מעל שבוע
        </label>
      </div>

      <div className="surface overflow-hidden rounded-xl border shadow-sm">
        <div className="overflow-x-auto">
          <table className="min-w-full text-right">
            <thead className="thead-bg">
              <tr>
                <th className="px-4 py-3 text-xs font-semibold text-m">כותרת</th>
                <th className="px-4 py-3 text-xs font-semibold text-m">מקור</th>
                <th className="px-4 py-3 text-xs font-semibold text-m">נושא</th>
                <th className="px-4 py-3 text-xs font-semibold text-m">תגובות / ביקורות</th>
                <th className="px-4 py-3 text-xs font-semibold text-m">דירוג</th>
                <th className="px-4 py-3 text-xs font-semibold text-m">פעילות אחרונה</th>
                <th className="px-4 py-3 text-xs font-semibold text-m">סטטוס</th>
              </tr>
            </thead>
            <tbody>
              {visibleItems.map((item) => (
                <tr key={item.id} className="row-hover border-t border-t-soft">
                  <td className="max-w-xs truncate px-4 py-3 text-sm font-medium" title={item.title}>
                    <a href={item.url} target="_blank" rel="noopener noreferrer" className="btn-edit">{item.title}</a>
                  </td>
                  <td className="whitespace-nowrap px-4 py-3 text-sm text-s">{item.source}</td>
                  <td className="whitespace-nowrap px-4 py-3 text-sm text-s">{item.topic || "—"}</td>
                  <td className="whitespace-nowrap px-4 py-3 text-sm text-s" style={{ fontVariantNumeric: "tabular-nums" }}>{item.replies}</td>
                  <td className="whitespace-nowrap px-4 py-3 text-sm text-s">{typeof item.rating === "number" ? item.rating.toFixed(1) : "—"}</td>
                  <td className="whitespace-nowrap px-4 py-3 text-sm text-m">{item.date || "—"}</td>
                  <td className="whitespace-nowrap px-4 py-3 text-sm">
                    <select value={item.status} onChange={(e) => handleStatusChange(item, e.target.value)} className="cell-input rounded-md px-2 py-1 text-sm">
                      {REVIEW_STATUSES.map((s) => (
                        <option key={s} value={s}>{s}</option>
                      ))}
                    </select>
                  </td>
                </tr>
              ))}
              {visibleItems.length === 0 && (
                <tr>
                  <td colSpan={7} className="px-4 py-8 text-center text-sm text-m">אין פריטים להצגה</td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

const TABS = [
  ["leads", "לידים"],
  ["market", "Market Research"],
];
const TAB_STORAGE_KEY = "active_tab";

function App() {
  const [tab, setTab] = useState(() => {
    try {
      return localStorage.getItem(TAB_STORAGE_KEY) || "leads";
    } catch {
      return "leads";
    }
  });

  function selectTab(next) {
    setTab(next);
    try {
      localStorage.setItem(TAB_STORAGE_KEY, next);
    } catch {}
  }

  return (
    <div dir="rtl">
      <div className="mx-auto max-w-6xl px-4 pt-4 sm:px-6">
        <div className="tab-bar flex gap-1 border-b">
          {TABS.map(([id, label]) => (
            <button key={id} type="button" onClick={() => selectTab(id)} className={`tab px-4 py-2.5 text-sm font-medium ${tab === id ? "tab-active" : ""}`} style={{ minHeight: 44 }}>
              {label}
            </button>
          ))}
        </div>
      </div>
      {/* Both tabs stay mounted so switching doesn't refetch from Airtable. */}
      <div style={{ display: tab === "leads" ? "block" : "none" }}>
        <LeadsDashboard />
      </div>
      <div style={{ display: tab === "market" ? "block" : "none" }} className="min-h-screen p-4 sm:p-6">
        <div className="mx-auto max-w-6xl">
          <h1 className="text-p mb-1 text-2xl font-bold">Market Research</h1>
          <p className="text-m mb-6 text-xs">שאלות מהפורום של arielsegal.co.il וחשמלאים מ-pro.co.il, נסרקים דרך Apify ונשמרים בטבלה Forum Leads</p>
          <MarketResearch />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
